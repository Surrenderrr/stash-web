    <script src="js/stash.js"></script>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        // Приложение на телефоне может днями висеть в памяти, не перезагружая страницу, - а новую версию
        // браузер ищет только при открытии. Поэтому проверяем сами: при возвращении в приложение и каждые 5 минут
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
            const check = () => reg.update().catch(() => { });
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
            setInterval(check, 5 * 60 * 1000);
        });
        // Пришла новая версия приложения - перезагрузить страницу один раз
        let hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hadController) location.reload();
            hadController = true;
        });
    </script>
